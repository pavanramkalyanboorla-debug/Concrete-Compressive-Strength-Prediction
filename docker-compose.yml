services:
  streamlit:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./artifacts:/app/artifacts
      - ./src:/app/src
      - ./app:/app/app

  fastapi:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./artifacts:/app/artifacts
      - ./src:/app/src
      - ./app:/app/app