[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "concrete-mix-optimizer"
version = "2.1.0"
description = "AI-driven concrete mix design under engineering constraints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "catboost>=1.0",
    "xgboost>=1.5",
    "optuna>=2.10",
    "shap>=0.41",
    "matplotlib>=3.5",
    "plotly>=5.5",
    "fastapi>=0.85",
    "uvicorn[standard]>=0.18",
    "streamlit>=1.20",
    "gradio>=3.0",
    "openpyxl>=3.0",
    "requests>=2.28",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0",
]