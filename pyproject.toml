[project]
name = "concrete-ccsp"
version = "0.1.0"
description = "Concrete Compressive Strength Prediction & Inverse Mix Advisor"
requires-python = ">=3.10,<3.13"          
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "seaborn>=0.12",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "catboost>=1.2",
    "xgboost>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "streamlit>=1.25",
    "python-multipart",
    "pydantic>=2",
    "joblib",
    "openpyxl",
    "pyarrow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false                          

[dependency-groups]
dev = [
    "pytest>=7",
    "jupyterlab",
    "ipykernel",
    "black",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]